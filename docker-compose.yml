services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: comprix
      MYSQL_USER: comprix
      MYSQL_PASSWORD: comprix_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: comprix
      DB_USER: comprix
      DB_PASSWORD: comprix_dev
      JWT_SECRET: ${JWT_SECRET:-comprix-change-me}
      UPLOAD_DIR: /app/uploads
      SMS_ENABLED: "false"
      DEV_OTP: "123456"
      ADMIN_PHONE: "13800000000"
      ADMIN_PASSWORD: admin123
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web-customer/dist:/usr/share/nginx/html/customer:ro
      - ./apps/web-admin/dist:/usr/share/nginx/html/admin:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - api

volumes:
  mysql_data:
