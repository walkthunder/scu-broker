# 里程碑模板 — 复制到 plane/milestones.yaml
# Excel 路径可由 skill 自动补全；首次导出会在 plane/pm-export/ 生成空白模板

meta:
  project_name: 项目名称
  template: plane/pm-export/华茂里程碑模板.xlsx
  output: plane/pm-export/项目名称——里程碑.xlsx
  sheet: "🎉 里程碑"

project:
  name: 项目名称
  start: "2026-01-01"
  end: "2026-12-31"
  owner_default: 负责人

milestones:
  - id: M001
    roadmap_no: 1
    name: 第一阶段
    goal: 目标描述
    deliverables: 交付物列表
    status: 未开始          # 已完成 | 进行中 | 部分完成 | 未开始
    priority: P0
    plan_date: "2026-01-15"
    actual_date: ""
    owner: 负责人
    tasks: roadmap#1
