# CompriX /scu 片段：插入到 computx.webinfra.cloud 的 server{} 内，
# 且必须位于 location / 之前。勿改其它 location。

    # —— scu-broker (CompriX) ——
    location = /scu {
        return 302 /scu/;
    }

    location ^~ /scu/api/ {
        proxy_pass http://127.0.0.1:3010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
        # 禁止边缘 CDN / 浏览器缓存业务 API
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_hide_header ETag;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location ^~ /scu/uploads/ {
        proxy_pass http://127.0.0.1:3010/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    location ^~ /scu/admin/ {
        root /opt/scu-broker/www;
        try_files $uri $uri/ /scu/admin/index.html;
    }

    location ^~ /scu/partner/ {
        root /opt/scu-broker/www;
        try_files $uri $uri/ /scu/partner/index.html;
    }

    location ^~ /scu/ {
        root /opt/scu-broker/www;
        try_files $uri $uri/ /scu/index.html;
    }
